# ==============================================================================
# Sorour Logistics ERP — Enterprise LAN Reverse Proxy Configuration (Nginx)
# ==============================================================================
# Provides TLS 1.3 encryption, rate limiting, and security headers across
# the local office network (LAN) for multi-workstation deployments.
# ==============================================================================

# Rate limiting zone: max 10 login requests per minute per client IP
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

# Upstream FastAPI application
upstream importflow_backend {
    server 127.0.0.1:28080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Hardened HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificates (Generated via scripts/generate_tls_cert.py)
    ssl_certificate /etc/ssl/certs/importflow_server.crt;
    ssl_certificate_key /etc/ssl/private/importflow_server.key;

    # TLS Protocols & High-Security Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Caching
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # File Upload Capacity (Maximum 50MB per batch)
    client_max_body_size 50M;

    # Buffer & Timeout Configurations
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # Login Endpoint Protection
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://importflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API & General Routes
    location / {
        proxy_pass http://importflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }
}
